name: Validate integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:public
      - run: npm run lint:openapi
      - run: npm run typecheck
      - name: Verify smoke tests require authentication
        run: |
          if npm run test:api > /tmp/smoke-output 2>&1; then
            echo 'Smoke tests unexpectedly succeeded without credentials'
            exit 1
          fi
          grep -q 'Set LEADMAGIC_API_KEY or run this script in an interactive terminal' /tmp/smoke-output
