openapi: 3.1.0
info:
  title: LeadMagic API
  version: 1.4.35
  description: LeadMagic public REST API for B2B enrichment and search. Use X-API-Key authentication. Examples are synthetic and do not describe real people or customers. Consult https://leadmagic.io/docs for current product behavior, https://leadmagic.io/pricing for pricing, and the published service terms for contractual conditions.
  contact:
    name: LeadMagic Support
    email: support@leadmagic.io
    url: https://leadmagic.io
  termsOfService: https://leadmagic.io/legal/terms
servers:
  - url: https://api.leadmagic.io
    description: Production API Server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your LeadMagic API key. Header name is case-insensitive (X-API-Key, X-API-KEY, x-api-key all work).
  parameters:
    BulkJobId:
      name: jobId
      in: path
      required: true
      description: UUID identifier of the bulk job.
      schema:
        type: string
        format: uuid
  headers:
    RateLimitLimit:
      description: Effective organization request ceiling for the current minute.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the effective organization minute window.
      schema:
        type: integer
    RateLimitReset:
      description: Unix epoch second when the current minute window resets.
      schema:
        type: integer
    SearchRpsLimit:
      description: Effective organization sustained Search RPS ceiling.
      schema:
        type: integer
    SearchRpsRemaining:
      description: Tokens remaining in the current sustained Search RPS window.
      schema:
        type: integer
    SearchRpsReset:
      description: Unix epoch second when the sustained Search RPS window refills.
      schema:
        type: integer
  schemas:
    ErrorResponse:
      type: object
      description: RFC 9457 Problem Details error response
      required:
        - success
        - errors
      properties:
        success:
          type: boolean
          description: Always false for error responses
        errors:
          type: array
          description: Array of error details (typically one, but can be multiple)
          items:
            $ref: "#/components/schemas/ErrorDetail"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ErrorDetail:
      type: object
      description: RFC 9457 compliant error detail
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: RFC 9457 - URI reference identifying the error type
        title:
          type: string
          description: RFC 9457 - Short human-readable summary
        status:
          type: integer
          description: RFC 9457 - HTTP status code
        detail:
          type: string
          description: RFC 9457 - Human-readable explanation specific to this occurrence
        instance:
          type: string
          format: uri-reference
          description: RFC 9457 - URI reference for this specific occurrence
        code:
          type: string
          description: Machine-readable error code for programmatic handling
        param:
          type: array
          description: Parameters that caused the error
          items:
            type: string
        action:
          type: string
          description: Suggested action to resolve the error
        docs:
          type: string
          format: uri
          description: Link to relevant documentation
        context:
          type: object
          description: Additional context specific to this error type
          additionalProperties: true
    ResponseMeta:
      type: object
      description: Metadata included in all responses
      properties:
        request_id:
          type: string
          format: uuid
          description: Unique identifier for this request (use for debugging/support)
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the response was generated
        environment:
          type: string
          description: API environment (production, staging)
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
    MissingAuthenticationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
    InvalidApiKeyError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
    InsufficientCreditsError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
    ResourceNotFoundError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
    ProfileNotFoundError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
    RateLimitExceededError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
    EmployeeFinderMessages:
      type: string
      description: Possible success messages for employee finder
      enum:
        - Employees found.
        - No employees found for this company.
    BulkSubmissionRequest:
      type: object
      description: Request body for submitting a bulk enrichment job via POST /bulk/submit. Provide exactly one of rows, csv, fileUrl, or scrape.
      required:
        - product
      properties:
        product:
          type: string
          description: The enrichment product to run on each row (e.g. email_finder, email_validation, mobile_finder, profile_search, company_search).
        rows:
          type: array
          description: JSON array of row objects for /bulk/json (or /bulk/submit auto-detect). Each row is an object whose keys match the input fields the selected product expects.
          items:
            type: object
            additionalProperties: true
        csv:
          type: string
          description: Inline CSV string for /bulk/csv (or /bulk/submit).
        fileUrl:
          type: string
          description: Public HTTPS URL to a remote file (CSV, JSON, JSONL). SSRF-validated server-side.
          format: uri
        format:
          type: string
          description: File format for fileUrl submissions.
          enum:
            - csv
            - json
            - jsonl
        scrape:
          type: object
          description: Browser-rendering config for /bulk/scrape (or /bulk/submit).
          properties:
            url:
              type: string
              format: uri
            mode:
              type: string
              enum:
                - scrape
                - crawl
                - content
                - markdown
                - links
                - json
                - snapshot
            extractPrompt:
              type: string
            render:
              type: boolean
            maxPages:
              type: integer
              minimum: 1
              maximum: 50
            maxDepth:
              type: integer
              minimum: 1
              maximum: 10
        inputMapping:
          type: object
          description: Optional column mapping from CSV/JSON columns to product input fields.
          additionalProperties:
            type: object
            properties:
              source:
                type: string
              column:
                type: string
              value: {}
        callback:
          type: object
          description: Webhook configuration.
          properties:
            url:
              type: string
              format: uri
              description: HTTPS URL to receive a POST on completion/failure. SSRF-validated.
            events:
              type: array
              items:
                type: string
                enum:
                  - completed
                  - failed
                  - canceled
                  - any
                  - job.completed
                  - job.failed
                  - job.canceled
              default:
                - completed
            inlineResults:
              type: boolean
            secret:
              type: string
            metadata:
              type: object
              additionalProperties: true
        idempotencyKey:
          type: string
          description: Optional idempotency key for safe retries.
        metadata:
          type: object
          additionalProperties: true
        presetId:
          type: string
        outputTransform:
          type: object
          properties:
            model:
              type: string
            prompt:
              type: string
            jsonSchema: {}
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
        fileName:
          type: string
    BulkSubmissionResponse:
      type: object
      description: Response for a successful bulk job submission. HTTP 202 Accepted.
      required:
        - jobId
        - product
        - totalRows
        - status
        - queue
      properties:
        jobId:
          type: string
          format: uuid
          description: UUID identifier for the bulk job.
        product:
          type: string
          description: The enrichment product this job is running.
        endpoint:
          type: string
          nullable: true
        totalRows:
          type: integer
          description: Total number of rows in the submission.
        status:
          type: string
          description: Always 'uploaded' for a freshly submitted job.
        queue:
          type: object
          properties:
            position:
              type: integer
            started:
              type: boolean
            queuedAt:
              type: string
              format: date-time
        statusUrl:
          type: string
          format: uri
        streamUrl:
          type: string
          format: uri
        wsUrl:
          type: string
        resultsUrl:
          type: string
          format: uri
        rowsUrl:
          type: string
          format: uri
        errorsUrl:
          type: string
          format: uri
        eventsUrl:
          type: string
          format: uri
        eventsExportUrl:
          type: string
          format: uri
        logsUrl:
          type: string
          format: uri
        downloadUrl:
          type: string
          format: uri
        progressUrl:
          type: string
          format: uri
        token:
          type: string
          description: Progress token for follow-up reads without the API key.
        exp:
          type: integer
          description: Unix timestamp when the progress token expires.
    JobSummary:
      type: object
      required:
        - job_id
        - status
        - total_rows
        - processed_items
        - succeeded_items
        - failed_items
        - created_at
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
        products:
          type: array
          items:
            type: string
          nullable: true
        submission_product:
          type: string
          nullable: true
        submission_endpoint:
          type: string
          nullable: true
        total_rows:
          type: integer
        processed_items:
          type: integer
        succeeded_items:
          type: integer
        failed_items:
          type: integer
        total_credits_consumed:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        last_progress_at:
          type: string
          format: date-time
          nullable: true
        file_name:
          type: string
          nullable: true
    JobsListResponse:
      type: object
      required:
        - jobs
        - limit
        - offset
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"
        limit:
          type: integer
        offset:
          type: integer
    JobSnapshot:
      type: object
      required:
        - job_id
        - status
        - total_rows
        - processed_items
        - succeeded_items
        - failed_items
        - skipped_items
        - created_at
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
        products:
          type: array
          items:
            type: string
          nullable: true
        submission_product:
          type: string
          nullable: true
        submission_endpoint:
          type: string
          nullable: true
        execution_mode:
          type: string
          nullable: true
        total_rows:
          type: integer
        processed_items:
          type: integer
        succeeded_items:
          type: integer
        failed_items:
          type: integer
        skipped_items:
          type: integer
        total_credits_consumed:
          type: string
          nullable: true
        total_duration_ms:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        last_progress_at:
          type: string
          format: date-time
          nullable: true
        file_name:
          type: string
          nullable: true
        callback_url:
          type: string
          nullable: true
        callback_event:
          type: string
          nullable: true
        priority:
          type: integer
          nullable: true
        output_transform:
          type:
            - object
            - "null"
          description: Optional output transform applied to result rows.
    JobDetailResponse:
      allOf:
        - $ref: "#/components/schemas/JobSnapshot"
        - type: object
          properties:
            links:
              type: object
              properties:
                statusUrl:
                  type: string
                streamUrl:
                  type: string
                wsUrl:
                  type: string
                resultsUrl:
                  type: string
                rowsUrl:
                  type: string
                errorsUrl:
                  type: string
                eventsUrl:
                  type: string
                eventsExportUrl:
                  type: string
                logsUrl:
                  type: string
                downloadUrl:
                  type: string
                progressUrl:
                  type: string
                token:
                  type: string
                exp:
                  type: integer
    ReviewResponse:
      type: object
      required:
        - jobId
        - status
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - running
            - canceled
    JobRow:
      type: object
      required:
        - id
        - row_index
        - status
      properties:
        id:
          type: string
          format: uuid
        row_index:
          type: integer
        status:
          type: string
        lm_input:
          type: object
          nullable: true
        lm_output:
          type: object
          nullable: true
        credits_consumed:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        http_status_code:
          type: integer
          nullable: true
        response_time_ms:
          type: integer
          nullable: true
        completed_at:
          type: string
          nullable: true
    JobRowsResponse:
      type: object
      required:
        - rows
        - limit
        - offset
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/JobRow"
        limit:
          type: integer
        offset:
          type: integer
    PreviewCostRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            properties:
              product:
                type: string
                description: Required for mixed-product mode. Omitted for per-product mode.
              input:
                type: object
                additionalProperties: true
              client_id:
                type: string
              client_name:
                type: string
              metadata:
                type: object
                additionalProperties: true
        budget_user_id:
          type: string
          description: User ID to check against configured Credit Budgets.
        client_id:
          type: string
        client_name:
          type: string
        metadata:
          type: object
          additionalProperties: true
    PreviewCostResponse:
      type: object
      required:
        - totalItems
        - totalCredits
        - estimatedCostUsd
        - perProduct
        - willExceedBudget
      properties:
        totalItems:
          type: integer
        creditsPerItem:
          type: number
          nullable: true
        totalCredits:
          type: number
        estimatedCostUsd:
          type: number
        perProduct:
          type: array
          items:
            type: object
            properties:
              product:
                type: string
              items:
                type: integer
              creditsPerItem:
                type: number
              credits:
                type: number
        clientCreditRemaining:
          type: string
          nullable: true
        willExceedBudget:
          type: boolean
    Budget:
      type: object
      properties:
        id:
          type: string
        scope:
          type: string
        scope_value:
          type: string
        max_credits:
          type: number
        period:
          type: string
        alert_threshold_pct:
          type: number
        alert_email:
          type: string
    BudgetStatus:
      type: object
      properties:
        scope:
          type: string
        scopeValue:
          type: string
        maxCredits:
          type: number
        remainingCredits:
          type: number
        isExceeded:
          type: boolean
    SuppressionList:
      type: object
      properties:
        list_id:
          type: string
        count:
          type: integer
        created_at:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: |
        Bad Request - The request was malformed or contains invalid parameters.

        **Common causes:**
        - Missing required fields
        - Invalid field format (e.g., malformed email)
        - Invalid JSON syntax
        - Invalid parameter values
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: |
        Unauthorized - Authentication failed.

        **Common causes:**
        - Missing X-API-Key header
        - Invalid or expired API key
        - Malformed API key
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/MissingAuthenticationError"
              - $ref: "#/components/schemas/InvalidApiKeyError"
    PaymentRequired:
      description: |
        Payment Required - Insufficient credits for this request.

        **Action required:** Add credits to your account at https://app.leadmagic.io/settings/billing
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InsufficientCreditsError"
    NotFound:
      description: |
        Not Found - The requested resource could not be found.

        **Common causes:**
        - Profile doesn't exist or is not accessible
        - Company not found in our database
        - Invalid URL or identifier
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ResourceNotFoundError"
              - $ref: "#/components/schemas/ProfileNotFoundError"
    RateLimitExceeded:
      description: |
        Too Many Requests - Rate limit exceeded.

        **Action required:** Check the `Retry-After` header for when to retry.

        **Headers returned:**
        - `Retry-After`: Seconds until you can retry
        - `RateLimit-Limit`: Your limit per minute
        - `RateLimit-Remaining`: Remaining requests this minute
        - `RateLimit-Reset`: Seconds until limit resets
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per minute
        RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests this minute
        RateLimit-Reset:
          schema:
            type: integer
          description: Seconds until limit resets
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RateLimitExceededError"
    InternalServerError:
      description: |
        Internal Server Error - Something went wrong on our end.

        **Action required:** Wait 30 seconds and retry. If the problem persists, contact support@leadmagic.io
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InternalServerError"
security:
  - ApiKeyAuth: []
tags:
  - name: Credits
    description: Manage and check your credit balance
  - name: Analytics
    description: Monitor your API usage with comprehensive analytics endpoints (FREE - no credits consumed)
  - name: People Enrichment
    description: Find and validate contact information for individuals
  - name: Company Data
    description: Discover company information and intelligence
  - name: Jobs Data
    description: Search job listings and detect career changes
  - name: Ads Data
    description: Search advertising data across platforms
  - name: Bulk Jobs
    description: Submit and manage bulk enrichment jobs for processing CSV files at scale
  - name: Batch
    description: Campaign-oriented batch enrichment with budgets, clients, suppression lists, and webhooks
  - name: Cost Control
    description: Preview costs, manage credit budgets, and maintain suppression lists to control spend
paths:
  /v1/credits:
    get:
      summary: Check Credits
      description: Check your current credit balance.
      operationId: check-credits
      tags:
        - Credits
      responses:
        "200":
          description: Successful credits retrieval
          content:
            application/json:
              schema:
                type: object
                properties:
                  credits:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/analytics/dashboard:
    get:
      summary: Dashboard Overview
      description: Get a real-time snapshot of your account including credits, rate limits, and usage statistics.
      operationId: analytics-dashboard
      tags:
        - Analytics
      responses:
        "200":
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                  credits:
                    type: object
                    properties:
                      current:
                        type: number
                      formatted:
                        type: string
                  rate_limit:
                    type: object
                    properties:
                      minute:
                        type: object
                        properties:
                          limit:
                            type: integer
                          used:
                            type: integer
                          remaining:
                            type: integer
                          utilization:
                            type: number
                      daily:
                        type: object
                        properties:
                          limit:
                            type: integer
                          used:
                            type: integer
                          remaining:
                            type: integer
                          utilization:
                            type: number
                  concurrency:
                    type: object
                    properties:
                      current:
                        type: integer
                      peak:
                        type: integer
                      active_reservations:
                        type: integer
                  stats:
                    type: object
                    properties:
                      today:
                        type: object
                        properties:
                          requests:
                            type: integer
                          credits:
                            type: number
                          chargeable_requests:
                            type: integer
                          chargeable_rate:
                            type: number
                          unique_products:
                            type: integer
                      this_week:
                        type: object
                        properties:
                          requests:
                            type: integer
                          credits:
                            type: number
                          chargeable_requests:
                            type: integer
                          chargeable_rate:
                            type: number
                          unique_products:
                            type: integer
                      this_month:
                        type: object
                        properties:
                          requests:
                            type: integer
                          credits:
                            type: number
                          chargeable_requests:
                            type: integer
                          chargeable_rate:
                            type: number
                          unique_products:
                            type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/analytics/usage:
    get:
      summary: Usage Summary
      description: Get daily usage summary with requests, credits consumed, and chargeable rates.
      operationId: analytics-usage
      tags:
        - Analytics
      parameters:
        - name: days
          in: query
          description: Number of days to include (1-90)
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Usage summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date
                      end:
                        type: string
                        format: date
                      days:
                        type: integer
                  summary:
                    type: object
                    properties:
                      total_requests:
                        type: integer
                      chargeable_requests:
                        type: integer
                      total_credits:
                        type: number
                      avg_credits_per_request:
                        type: number
                      chargeable_rate:
                        type: number
                      unique_products:
                        type: integer
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        total_requests:
                          type: integer
                        chargeable_requests:
                          type: integer
                        total_credits:
                          type: number
                        unique_products_used:
                          type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/analytics/products:
    get:
      summary: Products Breakdown
      description: Get per-product usage with requests, credits, and success rates.
      operationId: analytics-products
      tags:
        - Analytics
      parameters:
        - name: days
          in: query
          description: Number of days to include (1-90)
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Products breakdown retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date
                      end:
                        type: string
                        format: date
                      days:
                        type: integer
                  products:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        total_requests:
                          type: integer
                        total_credits:
                          type: number
                        successful_requests:
                          type: integer
                        failed_requests:
                          type: integer
                        success_rate:
                          type: number
                        avg_credits_per_request:
                          type: number
                  daily:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/analytics/credits:
    get:
      summary: Credit History
      description: Get credit consumption history with daily breakdown.
      operationId: analytics-credits
      tags:
        - Analytics
      parameters:
        - name: days
          in: query
          description: Number of days to include (1-90)
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Credit history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date
                      end:
                        type: string
                        format: date
                      days:
                        type: integer
                  summary:
                    type: object
                    properties:
                      total_credits:
                        type: number
                      total_requests:
                        type: integer
