        - Batch
      parameters:
        - name: product
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: client_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated batch list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Submit a Mixed-Product Batch
      description: Submit a batch containing items for one or more enrichment products.
      operationId: batch-submit
      tags:
        - Batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  description: Batch items. Each item carries `product` (required for mixed-product batches), `input`, and optional `client_id`, `client_name`, and `metadata`.
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      product:
                        type: string
                        description: Product to run this item against.
                      input:
                        type: object
                        description: Product-specific input fields.
                      client_id:
                        type: string
                      client_name:
                        type: string
                      metadata:
                        type: object
                idempotencyKey:
                  type: string
                  description: Submitting the same key twice returns the original batch instead of creating a duplicate.
                metadata:
                  type: object
                  description: Arbitrary metadata stored with the batch.
                client_id:
                  type: string
                  description: Associate the whole batch with a client record.
                client_name:
                  type: string
                  description: Client name recorded alongside the batch.
                budget_user_id:
                  type: string
                  description: Charge the batch against this member's credit budget.
                webhook_url:
                  type: string
                  format: uri
                  description: HTTPS URL notified when the batch completes. SSRF-validated — must resolve to a public IP.
                priority:
                  type: string
                  description: Queue priority for this batch.
                  enum:
                    - normal
                    - low
      responses:
        "202":
          description: Batch accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
