  /v3/companies/lookalike:
    post:
      summary: Company Lookalike
      description: |
        Find similar companies from a seed domain or description with full company output.
        Costs **5 credits** when one or more lookalikes are returned; **free** when empty.
        Common aliases (`domain`, `website`, `company_website`, `name`) and misspellings
        (`companny_domain`, `limmit`, …) are accepted and remapped.
      operationId: company-lookalike-v3
      tags:
        - Company Data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                company_domain:
                  type: string
                  description: Seed company domain. Aliases include domain, website, company_website, seed.domain. Typos like companny_domain are remapped.
                domain:
                  type: string
                  description: Alias for company_domain.
                website:
                  type: string
                  description: Seed website URL or domain.
                company_website:
                  type: string
                  description: Alias for website.
                company_name:
                  type: string
                  description: Seed company name used as text intent when no domain is supplied.
                name:
                  type: string
                  description: Alias for company_name.
                description:
                  type: string
                  description: Free-text seed description.
                company_description:
                  type: string
                  description: Alias for description.
                seed:
                  type: object
                  additionalProperties: true
                  description: Optional seed object. Prefer seed.domain.
                company_filters:
                  type: object
                  additionalProperties: true
                  description: Same full company filter family as Company Search. Alias filters.
                filters:
                  type: object
                  additionalProperties: true
                  description: Alias for company_filters.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 2000
                  default: 25
                  description: Page size. Typos like limmit are remapped.
                offset:
                  type: integer
                  minimum: 0
                  default: 0
      responses:
        "200":
          description: Company lookalike results (flat JSON body — not wrapped in data)
          headers:
            X-Credits-Cost:
              schema:
                type: number
              description: Credits reserved before finalization (5)
            X-Credits-Consumed:
              schema:
                type: number
              description: Credits actually charged (0 or 5)
            X-Credits-Remaining:
              schema:
                type: number
              description: Wallet credits remaining after this request
            X-Credits-Total:
              schema:
                type: number
            X-Request-Id:
              schema:
                type: string
            RateLimit-Remaining:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - message
                  - credits_consumed
                  - companies
                  - count
                  - returned_count
                properties:
                  message:
                    type: string
                  credits_consumed:
                    type: number
                    description: Flat 5 when results returned; 0 when empty
                  companies:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        company_domain:
                          type: string
                        company_name:
                          type: string
                        company_website:
                          type: string
                        company_industry_linkedin:
                          type: string
                        employee_range:
                          type: string
                        employee_min:
                          type: integer
                        employee_max:
                          type: integer
                        linkedin_employee_count:
                          type: integer
                        revenue_range:
                          type: string
                        revenue_min:
                          type: string
                        revenue_max:
                          type: string
                        hq_country:
                          type: string
                        hq_country_code:
                          type: string
                        hq_city:
                          type: string
                        hq_state:
                          type: string
                        similarity:
                          type: number
                          description: Lookalike similarity score when available
                        source_seed_domain:
                          type: string
                        match_context:
                          type: string
                  count:
                    type: integer
                  returned_count:
                    type: integer
                  limit_applied:
                    type: integer
                  offset:
                    type: integer
                  interpreted_search:
                    type: object
                    additionalProperties: true
                    description: Normalized seed and company_filters used for the query
                  metadata:
                    type: object
                    additionalProperties: true
                    properties:
                      query_name:
                        type: string
                      query_path:
                        type: string
                      preview:
                        type: boolean
                      degraded:
                        type: boolean
                        description: True when upstream was briefly unavailable and an empty free response was returned
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
