                $ref: "#/components/schemas/PreviewCostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/batch/budgets:
    post:
      summary: Create Credit Budget
      description: Create a new credit budget to cap spend per scope.
      operationId: create-budget
      tags:
        - Cost Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scope
                - scope_value
                - max_credits
              properties:
                scope:
                  type: string
                scope_value:
                  type: string
                max_credits:
                  type: number
                period:
                  type: string
                alert_threshold_pct:
                  type: number
                  minimum: 0
                  exclusiveMinimum: 0
                  maximum: 1
                  exclusiveMaximum: 1
                alert_email:
                  type: string
                  format: email
      responses:
        "201":
          description: Budget created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
    get:
      summary: List Credit Budgets
      description: List all credit budgets for the authenticated account.
      operationId: list-budgets
      tags:
        - Cost Control
      responses:
        "200":
          description: List of budgets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/batch/budgets/status:
    get:
      summary: Get Budget Status
      description: Consumption status for all budgets.
      operationId: budget-status
      tags:
        - Cost Control
      responses:
        "200":
          description: Budget consumption status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/batch/budgets/{id}:
    patch:
      summary: Update Credit Budget
      description: Update max_credits, period, alert_threshold_pct, and/or alert_email.
      operationId: update-budget
      tags:
        - Cost Control
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the credit budget.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_credits:
                  type: number
                period:
                  type: string
                alert_threshold_pct:
                  type: number
                alert_email:
                  type: string
      responses:
        "200":
          description: Updated budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete Credit Budget
      description: Hard-delete a credit budget.
      operationId: delete-budget
      tags:
        - Cost Control
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the credit budget.
          schema:
            type: string
      responses:
        "200":
          description: Budget deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/batch/suppression-lists:
    post:
      summary: Create Suppression List
      description: Create a new suppression list with initial emails. Emails are SHA-256 hashed server-side.
      operationId: create-suppression-list
      tags:
        - Cost Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list_id
                - emails
              properties:
                list_id:
                  type: string
                emails:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Suppression list created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppressionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: List Suppression Lists
      description: List all suppression lists for the authenticated account.
      operationId: list-suppression-lists
      tags:
        - Cost Control
      responses:
        "200":
          description: List of suppression lists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuppressionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/batch/suppression-lists/{listId}:
    get:
      summary: Get Suppression List
      description: Get list details and paginated email hashes.
      operationId: get-suppression-list
      tags:
        - Cost Control
      parameters:
        - name: listId
          in: path
          required: true
          description: Identifier of the suppression list.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List details with paginated hashes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppressionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Delete Suppression List
      description: Delete an entire suppression list.
      operationId: delete-suppression-list
      tags:
        - Cost Control
      parameters:
        - name: listId
          in: path
          required: true
          description: Identifier of the suppression list.
          schema:
            type: string
      responses:
        "200":
          description: List deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/batch/suppression-lists/{listId}/emails:
    post:
      summary: Add Emails to Suppression List
      description: Add emails to an existing suppression list. Emails are SHA-256 hashed server-side.
      operationId: add-suppression-emails
      tags:
        - Cost Control
      parameters:
        - name: listId
          in: path
          required: true
          description: Identifier of the suppression list.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emails
              properties:
                emails:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Emails added.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Remove Emails from Suppression List
      description: Remove emails from a suppression list.
      operationId: remove-suppression-emails
      tags:
        - Cost Control
      parameters:
        - name: listId
          in: path
          required: true
          description: Identifier of the suppression list.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emails
              properties:
                emails:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Emails removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
